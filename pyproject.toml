[project]
name = "databricks-network-policy-helper"
version = "0.1.0"
description = "Build Databricks account network policies from real observed traffic — a visually engaging CLI for context-based ingress (CBI), serverless egress (SEG), and IP ACL migration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Weaver" }]
keywords = ["databricks", "network-policy", "cbi", "seg", "security", "cli"]
dependencies = [
    # databricks-sdk >= 0.113.0 is required for the Context-Based Ingress (CBI) policy
    # dataclasses (CustomerFacingIngressNetworkPolicy*).
    "databricks-sdk>=0.113.0",
    "databricks-sql-connector>=3.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/andyweaves/databricks-network-policy-helper"
Repository = "https://github.com/andyweaves/databricks-network-policy-helper"

[project.scripts]
dbx-netpolicy = "dbx_netpolicy.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_netpolicy"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # typer uses function-call defaults (Option/Argument) by design

[tool.pytest.ini_options]
testpaths = ["tests"]
