[project]
name = "databricks-network-policy-helper"
# Version is derived from the git tag by hatch-vcs (see [tool.hatch.version]); a release is
# cut by tagging the commit `vX.Y.Z`. Between tags the build reports a PEP 440 dev version
# (e.g. 0.1.1.dev3+g<sha>). Never hardcode it here.
dynamic = ["version"]
description = "Build Databricks account network policies from real observed traffic — a visually engaging CLI for context-based ingress (CBI), serverless egress (SEG), and IP ACL migration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Andrew Weaver" }]
keywords = ["databricks", "network-policy", "cbi", "seg", "security", "cli"]
dependencies = [
    # databricks-sdk >= 0.113.0 is required for the Context-Based Ingress (CBI) policy
    # dataclasses (CustomerFacingIngressNetworkPolicy*).
    "databricks-sdk>=0.113.0",
    "databricks-sql-connector>=3.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.1",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    # Verify TLS against the OS trust store so corporate-proxy root CAs are honoured by the SDK,
    # the SQL connector, and feed downloads alike (see src/dbx_nwp_helper/tls.py).
    "truststore>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/andyweaves/databricks-network-policy-helper"
Repository = "https://github.com/andyweaves/databricks-network-policy-helper"

[project.scripts]
dbx-nwp-helper = "dbx_nwp_helper.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.0.0",
]

[build-system]
# Upper bounds keep the build resolvable behind the internal PyPI mirror, which does not serve the
# very latest hatchling / the setuptools-scm 10.x → vcs-versioning chain. Public PyPI (CI) is happy
# with these too. Relax the ceilings once the mirror approves the newer releases.
requires = ["hatchling<1.32", "hatch-vcs>=0.4,<0.5", "setuptools-scm<10"]
build-backend = "hatchling.build"

# Derive the package version from the git tag (single source of truth). Tag `v0.1.0` -> 0.1.0.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_nwp_helper"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # typer uses function-call defaults (Option/Argument) by design

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dbx_nwp_helper"]
branch = true

[tool.coverage.report]
show_missing = true
